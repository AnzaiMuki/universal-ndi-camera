name: Build iOS (VYRA Camera)

# Compile l'app iPhone sur un Mac dans le cloud (gratuit pour un dépôt public). Produit un .ipa
# NON SIGNÉ : à installer sur l'iPhone avec Sideloadly / AltStore + un identifiant Apple GRATUIT
# (ces outils re-signent eux-mêmes). Aucun compte Apple Developer payant nécessaire pour tester.

on:
  push:
    paths: ["ios/VyraCamera/**"]
  pull_request:
    paths: ["ios/VyraCamera/**"]
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

jobs:
  # SRT natif : compile libsrt pour iOS (sans chiffrement → sans OpenSSL) puis COMPILE L'APP avec
  # le chemin SRT activé et lié à libsrt. Vérifie compile+link du transport SRT (SrtClient + CSrt).
  srt-build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios/VyraCamera
    steps:
      - uses: actions/checkout@v4
      - name: Sélectionner Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Installer CMake + XcodeGen
        run: brew install cmake xcodegen
      - name: Compiler libsrt (iphonesimulator arm64, sans chiffrement)
        run: |
          git clone --depth 1 https://github.com/Haivision/srt.git "$RUNNER_TEMP/srt"
          cd "$RUNNER_TEMP/srt"
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/srtinstall" \
            -DENABLE_ENCRYPTION=OFF -DENABLE_APPS=OFF \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DENABLE_STDCXX_SYNC=ON
          cmake --build build --config Release -j3
          cmake --install build
          test -f "$RUNNER_TEMP/srtinstall/lib/libsrt.a" && test -f "$RUNNER_TEMP/srtinstall/include/srt/srt.h"
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Choisir un simulateur disponible
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((x['udid'] for r in d['devices'].values() for x in r if x.get('isAvailable') and 'iPhone' in x['name']), ''))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Compiler l'app avec SRT activé (compile + link)
        run: |
          SRT="$RUNNER_TEMP/srtinstall"
          xcodebuild build \
            -project VyraCamera.xcodeproj \
            -scheme VyraCamera \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DDsrt" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="SRT_ENABLED" \
            HEADER_SEARCH_PATHS="$SRT/include" \
            LIBRARY_SEARCH_PATHS="$SRT/lib" \
            OTHER_LDFLAGS="-lsrt -lc++" \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=$PWD/CSrt/module.modulemap -Xcc -I$SRT/include"

  # Tests de A à Z sur SIMULATEUR iOS (dans le cloud macOS, gratuit) : formats filaires UNDI
  # vérifiés octet par octet, puis l'app est installée et LANCÉE dans le simulateur (smoke test).
  # NB : le simulateur n'a pas de caméra → la captation réelle se teste sur iPhone physique.
  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios/VyraCamera
    steps:
      - uses: actions/checkout@v4
      - name: Sélectionner Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Choisir un simulateur disponible
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((x['udid'] for r in d['devices'].values() for x in r if x.get('isAvailable') and 'iPhone' in x['name']), ''))")
          echo "Simulateur : $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Tests unitaires (protocole UNDI)
        run: |
          xcodebuild test \
            -project VyraCamera.xcodeproj \
            -scheme VyraCamera \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO
      - name: Smoke test (installe + lance l'app dans le simulateur)
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          APP=$(find "$RUNNER_TEMP/DD" -name 'VyraCamera.app' -path '*-iphonesimulator*' | head -1)
          echo "App : $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.ndicam.vyracamera

  build:
    runs-on: macos-14
    needs: test
    defaults:
      run:
        working-directory: ios/VyraCamera
    steps:
      - uses: actions/checkout@v4

      # XcodeGen génère un projet au format Xcode 16 (objectVersion 77) : il faut sélectionner
      # un Xcode 16 sur le runner, sinon le Xcode par défaut (15.x) refuse de l'ouvrir.
      - name: Sélectionner Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (archive non signée)
        run: |
          xcodebuild \
            -project VyraCamera.xcodeproj \
            -scheme VyraCamera \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/VyraCamera.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Empaqueter en .ipa non signé
        run: |
          APP="$RUNNER_TEMP/VyraCamera.xcarchive/Products/Applications/VyraCamera.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -r -y VyraCamera-unsigned.ipa Payload >/dev/null)

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: VyraCamera-unsigned-ipa
          path: ${{ runner.temp }}/VyraCamera-unsigned.ipa
          if-no-files-found: error
