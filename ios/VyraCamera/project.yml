# Spécification XcodeGen → génère VyraCamera.xcodeproj (pas de .pbxproj écrit à la main).
# Le CI (GitHub Actions) lance `xcodegen generate` puis `xcodebuild`.
name: VyraCamera
options:
  bundleIdPrefix: com.ndicam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
targets:
  VyraCamera:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ndicam.vyracamera
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: VYRA Camera
        UILaunchScreen: {}
        NSCameraUsageDescription: "VYRA Camera utilise la caméra pour filmer et diffuser vers VYRA Studio."
        NSMicrophoneUsageDescription: "VYRA Camera utilise le micro pour la prise de son du direct."
        NSLocalNetworkUsageDescription: "VYRA Camera se connecte à VYRA Studio sur votre réseau local (Wi-Fi)."
        NSBonjourServices:
          - _undicam._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
